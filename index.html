<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fantasy Draft Command Center</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">2026 Fantasy Football</p>
        <h1>Draft Command Center</h1>
      </div>
      <div class="top-actions">
        <label>Draft slot <select id="slot"></select></label>
        <button id="undo" type="button">Undo</button>
        <button id="reset" class="danger" type="button">Reset</button>
      </div>
    </header>

    <section class="status-strip" aria-live="polite">
      <div><span>Current</span><strong id="currentPick">1.01</strong></div>
      <div><span>Your next</span><strong id="nextPick">1.01</strong></div>
      <div><span>Picks away</span><strong id="picksAway">0</strong></div>
      <div><span>Drafted</span><strong id="draftedCount">0 / 180</strong></div>
    </section>

    <section class="workspace">
      <div class="left-column">
        <section class="panel quick-pick-panel">
          <div class="section-head">
            <div><p class="eyebrow">Fast entry</p><h2>Mark the latest pick</h2></div>
            <span class="hint">Search → Other / Mine</span>
          </div>
          <input id="search" class="search" type="search" placeholder="Start typing a player name…" autocomplete="off" />
          <div class="filters" id="filters">
            <button class="filter active" data-pos="ALL" type="button">All</button>
            <button class="filter" data-pos="RB" type="button">RB</button>
            <button class="filter" data-pos="WR" type="button">WR</button>
            <button class="filter" data-pos="QB" type="button">QB</button>
            <button class="filter" data-pos="TE" type="button">TE</button>
            <button class="filter" data-pos="DST" type="button">D/ST</button>
            <button class="filter" data-pos="K" type="button">K</button>
          </div>
          <div id="playerRows" class="player-list"></div>
        </section>

        <section class="panel history-panel">
          <div class="section-head"><div><p class="eyebrow">Draft log</p><h2>Recent picks</h2></div></div>
          <div id="history" class="history"></div>
        </section>
      </div>

      <aside class="right-column">
        <section class="panel recommendation-panel sticky-panel">
          <div class="section-head">
            <div><p class="eyebrow">Decision engine</p><h2>Best Available</h2></div>
            <span class="badge">PPR • 6-pt pass TD</span>
          </div>
          <div id="recommendations" class="recommendations"></div>
        </section>

        <section class="panel roster-panel">
          <div class="section-head"><div><p class="eyebrow">Your team</p><h2>Roster</h2></div></div>
          <div id="rosterSummary" class="roster-summary"></div>
          <div id="myRoster" class="my-roster"></div>
        </section>
      </aside>
    </section>
  </main>

  <script src="players.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
